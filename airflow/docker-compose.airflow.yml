services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # One-shot initializer: migrate the metadata DB and create the admin user,
  # then exit. webserver/scheduler/triggerer wait for this via
  # service_completed_successfully, so a clean `docker compose up` / `make up-all`
  # works with no manual db-migrate / user-create steps. Overrides the default
  # entrypoint to run migrate + user create directly. Default login: admin / admin.
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Cyber --lastname Sentinel --role Admin \
          --email admin@phantomeye.local || true
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../bronze:/opt/airflow/bronze
      - ../silver:/opt/airflow/silver
      - ../lookups:/opt/airflow/lookups
      - ../ct:/opt/airflow/ct
      - ../ml:/opt/airflow/ml
      - ../gold:/opt/airflow/gold
      - ../config:/opt/airflow/config
      - ../scripts:/opt/airflow/scripts
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
      AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "10800" # 3 hours
      AIRFLOW__SCHEDULER__TASK_HEARTBEAT_SEC: "30"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../bronze:/opt/airflow/bronze
      - ../silver:/opt/airflow/silver
      - ../lookups:/opt/airflow/lookups
      - ../ct:/opt/airflow/ct
      - ../ml:/opt/airflow/ml
      - ../gold:/opt/airflow/gold
      - ../config:/opt/airflow/config
      - ../scripts:/opt/airflow/scripts
    command: scheduler

  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../ct:/opt/airflow/ct
      - ../ml:/opt/airflow/ml
      - ../gold:/opt/airflow/gold
      - ../config:/opt/airflow/config
      - ../scripts:/opt/airflow/scripts
    command: triggerer

volumes:
  pgdata:
