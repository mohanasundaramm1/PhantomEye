services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # One-shot initializer: migrate the metadata DB and create the admin user,
  # then exit. webserver/scheduler/triggerer wait for this via
  # service_completed_successfully, so a clean `docker compose up` / `make up-all`
  # works with no manual db-migrate / user-create steps. Overrides the default
  # entrypoint to run migrate + user create directly. Default login: admin / admin.
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Cyber --lastname Sentinel --role Admin \
          --email admin@phantomeye.local || true
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # campaign_radar_dag's tasks import product.* -- this is a SEPARATE
      # docker-compose project from app-db (root docker-compose.yml), so
      # "localhost" inside this container is not app-db's container; Docker
      # Desktop's host.docker.internal reaches the same host-published port
      # (5433) the venv on the Mac itself uses.
      APP_DATABASE_URL: "postgresql+psycopg2://app:app@host.docker.internal:5433/campaigns"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../bronze:/opt/airflow/bronze
      - ../silver:/opt/airflow/silver
      - ../lookups:/opt/airflow/lookups
      - ../ct:/opt/airflow/ct
      - ../ml:/opt/airflow/ml
      - ../gold:/opt/airflow/gold
      - ../config:/opt/airflow/config
      - ../scripts:/opt/airflow/scripts
      - ../product:/opt/airflow/product
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
      AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "10800" # 3 hours
      # (a TASK_HEARTBEAT_SEC var used to sit here -- that key doesn't exist in
      # Airflow and was silently ignored, the same trap as the zombie-threshold
      # var name above. The real knob, job_heartbeat_sec, defaults to 5s which
      # is already what we want.)
      # See the webserver block above for why this points at host.docker.internal
      # rather than localhost: app-db lives in a different compose project.
      APP_DATABASE_URL: "postgresql+psycopg2://app:app@host.docker.internal:5433/campaigns"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../bronze:/opt/airflow/bronze
      - ../silver:/opt/airflow/silver
      - ../lookups:/opt/airflow/lookups
      - ../ct:/opt/airflow/ct
      - ../ml:/opt/airflow/ml
      - ../gold:/opt/airflow/gold
      - ../config:/opt/airflow/config
      - ../scripts:/opt/airflow/scripts
      - ../product:/opt/airflow/product
    command: scheduler

  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
      APP_DATABASE_URL: "postgresql+psycopg2://app:app@host.docker.internal:5433/campaigns"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../ct:/opt/airflow/ct
      - ../ml:/opt/airflow/ml
      - ../gold:/opt/airflow/gold
      - ../config:/opt/airflow/config
      - ../scripts:/opt/airflow/scripts
      - ../product:/opt/airflow/product
    command: triggerer

volumes:
  pgdata:
