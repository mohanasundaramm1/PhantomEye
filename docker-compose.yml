services:
  # NOTE on restart policies: the real-time CT lane is a chain --
  # certstream -> forwarder.py -> kafka -> stream_ct.py -> ct/data/raw. A crash
  # anywhere in that chain silently stalls everything downstream (this is
  # exactly how an 8h ingestion outage went unnoticed). certstream already had
  # `restart: unless-stopped`; the broker + zookeeper it depends on did not, so
  # a broker OOM/crash was unrecoverable. `unless-stopped` restarts on crash and
  # on Docker/host boot, but respects an explicit `docker compose stop`.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:3.31.0
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    restart: unless-stopped

  # Certificate-Transparency-log websocket source for the real-time CT lane.
  # ct/ingest/forwarder.py (CERTSTREAM_WS, default "ws://127.0.0.1:4000") connects
  # here and forwards domains into Kafka. Nothing else in this repo runs a
  # CertStream server, so forwarder.py has nothing to talk to without this service.
  #
  # Image: d-Rickyy-b/certstream-server-go (MIT, actively maintained, 200+ stars,
  # explicit drop-in replacement for the original CaliDog/certstream-server):
  #   https://github.com/d-Rickyy-b/certstream-server-go
  # Official Docker Hub image, pinned to the v1.9.0 release tag (not :latest):
  #   https://hub.docker.com/r/0rickyy0/certstream-server-go
  #
  # No config file is mounted: with none mounted the image falls back to its
  # baked-in config.sample.yaml, which listens on 0.0.0.0:8080 and pulls from
  # the default set of CT logs, which is enough for local dev.
  #
  # We map host port 4000 -> container port 8080 so the container's *default*
  # lite endpoint at "/" is reachable at ws://127.0.0.1:4000 with NO path
  # suffix -- exactly forwarder.py's existing CERTSTREAM_WS default, so no
  # code change is needed there. Deliberately NOT using the server's
  # "/domains-only" endpoint: that endpoint flattens output to
  # {"data": [...domains], "message_type": "dns_entries"}, which does not
  # match forwarder.py's parsing of data.leaf_cert.all_domains. The lite
  # endpoint ("/") keeps the leaf_cert.all_domains nesting (it only drops the
  # heavy as_der/chain fields), so it's the compatible choice.
  certstream:
    image: 0rickyy0/certstream-server-go:v1.9.0
    ports:
      - "4000:8080"
    restart: unless-stopped

  # Application datastore for the campaign-radar layer (analyst/product state:
  # observations, campaigns, dispositions, watchlist). Deliberately SEPARATE
  # from Airflow's own metadata Postgres -- the parquet lake stays the detection
  # pipeline's source of truth; this DB is the serving/interaction store.
  # Host port 5433 avoids clashing with a local 5432. APP_DATABASE_URL points
  # host-run jobs/API here: postgresql+psycopg2://app:app@localhost:5433/campaigns
  app-db:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: campaigns
    ports:
      - "5433:5432"
    volumes:
      - appdb_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d campaigns" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  appdb_data:
